name: Set up Java and Ghidra
description: Install JDK 21, restore or download the pinned Ghidra release, and set GHIDRA_INSTALL_DIR.

inputs:
  ghidra-version:
    description: Ghidra release version.
    required: true
  ghidra-build-date:
    description: Build date in the Ghidra release file name.
    required: true
  ghidra-zip-sha256:
    description: SHA-256 checksum of the Ghidra release archive.
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Cache Ghidra distribution
      id: cache-ghidra
      uses: actions/cache@v4
      with:
        path: ghidra-dist
        key: ghidra-${{ inputs.ghidra-version }}-${{ inputs.ghidra-build-date }}

    - name: Download Ghidra
      if: steps.cache-ghidra.outputs.cache-hit != 'true'
      shell: bash
      env:
        GHIDRA_VERSION: ${{ inputs.ghidra-version }}
        GHIDRA_BUILD_DATE: ${{ inputs.ghidra-build-date }}
        GHIDRA_ZIP_SHA256: ${{ inputs.ghidra-zip-sha256 }}
      run: |
        set -euo pipefail
        zip_name="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_BUILD_DATE}.zip"
        tag="Ghidra_${GHIDRA_VERSION}_build"
        url="https://github.com/NationalSecurityAgency/ghidra/releases/download/${tag}/${zip_name}"
        curl -sL --fail -o "$zip_name" "$url"
        echo "${GHIDRA_ZIP_SHA256}  ${zip_name}" | sha256sum -c -
        mkdir -p ghidra-dist
        unzip -q "$zip_name" -d ghidra-dist
        rm "$zip_name"

    - name: Resolve GHIDRA_INSTALL_DIR
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$(find ghidra-dist -maxdepth 1 -mindepth 1 -type d | head -n 1)"
        if [ -z "$install_dir" ]; then
          echo "Could not locate an extracted Ghidra directory under ghidra-dist/" >&2
          exit 1
        fi
        echo "GHIDRA_INSTALL_DIR=$(cd "$install_dir" && pwd)" >> "$GITHUB_ENV"
