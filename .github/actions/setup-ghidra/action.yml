name: Install Java and Ghidra
description: >-
  This action installs JDK 21.
  It restores or downloads the specified Ghidra release.
  It sets GHIDRA_INSTALL_DIR.

inputs:
  ghidra-version:
    description: Ghidra release version.
    required: true
  ghidra-build-date:
    description: Build date in the Ghidra release file name.
    required: true
  ghidra-zip-sha256:
    description: SHA-256 checksum of the Ghidra release archive.
    required: true

runs:
  using: composite
  steps:
    - name: Install JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
        cache: 'gradle'

    - name: Cache Ghidra distribution
      id: cache-ghidra
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ghidra-dist
        key: ghidra-${{ inputs.ghidra-version }}-${{ inputs.ghidra-build-date }}-${{ runner.os }}

    - name: Download Ghidra
      if: steps.cache-ghidra.outputs.cache-hit != 'true'
      shell: bash
      env:
        GHIDRA_VERSION: ${{ inputs.ghidra-version }}
        GHIDRA_BUILD_DATE: ${{ inputs.ghidra-build-date }}
        GHIDRA_ZIP_SHA256: ${{ inputs.ghidra-zip-sha256 }}
      run: |
        set -euo pipefail
        ghidra_dist="${RUNNER_TEMP}/ghidra-dist"
        zip_name="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_BUILD_DATE}.zip"
        zip_path="${RUNNER_TEMP}/${zip_name}"
        tag="Ghidra_${GHIDRA_VERSION}_build"
        url="https://github.com/NationalSecurityAgency/ghidra/releases/download/${tag}/${zip_name}"
        curl -sL --fail -o "$zip_path" "$url"
        echo "${GHIDRA_ZIP_SHA256}  ${zip_path}" | sha256sum -c -
        mkdir -p "$ghidra_dist"
        unzip -q "$zip_path" -d "$ghidra_dist"
        rm "$zip_path"

    - name: Resolve GHIDRA_INSTALL_DIR
      shell: bash
      run: |
        set -euo pipefail
        ghidra_dist="${RUNNER_TEMP}/ghidra-dist"
        install_dir=""
        if [ -d "$ghidra_dist" ]; then
          install_dir="$(find "$ghidra_dist" -maxdepth 1 -mindepth 1 -type d | head -n 1)"
        fi
        if [ -z "$install_dir" ]; then
          echo "Cannot find an extracted Ghidra directory under ${ghidra_dist}/" >&2
          exit 1
        fi
        echo "GHIDRA_INSTALL_DIR=$(cd "$install_dir" && pwd)" >> "$GITHUB_ENV"
