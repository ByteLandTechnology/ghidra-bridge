name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main. It can publish a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check GitHub Actions workflows
        run: |
          set -euo pipefail
          linter_dir="${RUNNER_TEMP}/linters"
          mkdir -p "$linter_dir"
          actionlint_archive="${linter_dir}/actionlint.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sL --fail -o "$actionlint_archive" "$actionlint_url"
          echo "${ACTIONLINT_SHA256}  ${actionlint_archive}" | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$linter_dir" actionlint
          shellcheck_archive="${linter_dir}/shellcheck.tar.xz"
          shellcheck_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sL --fail -o "$shellcheck_archive" "$shellcheck_url"
          echo "${SHELLCHECK_SHA256}  ${shellcheck_archive}" | sha256sum -c -
          tar -xJf "$shellcheck_archive" --strip-components=1 -C "$linter_dir" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm -f "$actionlint_archive" "$shellcheck_archive"
          echo "$linter_dir" >> "$GITHUB_PATH"
          "$linter_dir/actionlint" -shellcheck "$linter_dir/shellcheck" .github/workflows/ci.yml

      - name: Check shell scripts
        run: |
          set -euo pipefail
          shellcheck -o check-extra-masked-returns .github/scripts/*.sh
          python3 - .github/actions/setup-ghidra/action.yml <<'PY'
          import pathlib, re, subprocess, sys

          expr_pattern = re.compile(r"\$" + r"\{\{[^}]*\}\}")
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          index = 0
          blocks = 0
          while index < len(lines):
              line = lines[index]
              stripped = line.lstrip()
              indent = len(line) - len(stripped)
              if re.match(r"^(?:-\s+)?run:\s*[|>][-+]?\s*$", stripped):
                  index += 1
                  body = []
                  block_indent = None
                  while index < len(lines):
                      current = lines[index]
                      if not current.strip():
                          body.append("")
                          index += 1
                          continue
                      current_indent = len(current) - len(current.lstrip())
                      if current_indent <= indent:
                          break
                      if block_indent is None:
                          block_indent = current_indent
                      body.append(current[block_indent:])
                      index += 1
                  script = expr_pattern.sub("ACTION_INPUT", "\n".join(body)) + "\n"
                  subprocess.run(
                      ["shellcheck", "-s", "bash", "-o", "check-extra-masked-returns", "-"],
                      input=script,
                      text=True,
                      check=True,
                  )
                  blocks += 1
                  continue
              index += 1
          if blocks == 0:
              raise SystemExit(f"No composite run steps found in {path}")
          PY

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: ./gradlew --no-daemon clean verify

      - name: Test function mutations
        run: |
          ./gradlew --no-daemon :wire:test :contracts:test
          python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

  release:
    # Update the release PR or create a release after main passes verification.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip.sha256" \
            --clobber
