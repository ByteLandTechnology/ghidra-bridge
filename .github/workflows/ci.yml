name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "0 4 * * *"
  workflow_call:
    inputs:
      ref:
        description: Git reference of ghidra-bridge to verify.
        required: false
        type: string
        default: ""
      ghidra-version:
        description: Primary Ghidra release version for the six-target matrix.
        required: false
        type: string
        default: "12.1.4"
      ghidra-build-date:
        description: Build date in the primary Ghidra release file name.
        required: false
        type: string
        default: ""
      ghidra-zip-sha256:
        description: SHA-256 checksum of the primary Ghidra release archive.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  # Never cancel a run on main. It can publish a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use Ghidra 12.1.4 by default for release archives and matrix legs.
  GHIDRA_VERSION: "12.1.4"
  GHIDRA_BUILD_DATE: "20260921"
  GHIDRA_ZIP_SHA256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"

jobs:
  verify-pr:
    name: verify (${{ matrix.os }}, Ghidra ${{ matrix.ghidra }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ghidra: "12.1.4"
          - os: macos-15
            ghidra: "12.1.4"
          - os: windows-2025
            ghidra: "12.1.4"
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ matrix.ghidra }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./gradlew.bat --no-daemon clean verify
          else
            ./gradlew --no-daemon clean verify
          fi

      - name: Test function mutations
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./gradlew.bat --no-daemon :wire:test :contracts:test
            python tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless.bat"
          else
            ./gradlew --no-daemon :wire:test :contracts:test
            python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
          fi

  verify-main:
    name: verify (${{ matrix.os }}, Ghidra ${{ matrix.ghidra }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            ghidra: "12.1.4"
          - os: macos-15
            ghidra: "12.1.4"
          - os: ubuntu-24.04
            ghidra: "12.1.4"
          - os: ubuntu-24.04-arm
            ghidra: "12.1.4"
          - os: windows-2025
            ghidra: "12.1.4"
          - os: windows-11-arm
            ghidra: "12.1.4"
          - os: ubuntu-24.04
            ghidra: "12.1.2"
            ghidra_build_date: "20260605"
            ghidra_zip_sha256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ matrix.ghidra == '12.1.2' && matrix.ghidra || inputs.ghidra-version || matrix.ghidra }}
          ghidra-build-date: ${{ matrix.ghidra == '12.1.2' && matrix.ghidra_build_date || inputs.ghidra-build-date || '' }}
          ghidra-zip-sha256: ${{ matrix.ghidra == '12.1.2' && matrix.ghidra_zip_sha256 || inputs.ghidra-zip-sha256 || '' }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./gradlew.bat --no-daemon clean verify
          else
            ./gradlew --no-daemon clean verify
          fi

      - name: Test function mutations
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./gradlew.bat --no-daemon :wire:test :contracts:test
            python tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless.bat"
          else
            ./gradlew --no-daemon :wire:test :contracts:test
            python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
          fi

  verify:
    name: verify
    needs: [verify-pr, verify-main]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check verification status
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RESULT: ${{ needs.verify-pr.result }}
          MAIN_RESULT: ${{ needs.verify-main.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$PR_RESULT" = "success"
            test "$MAIN_RESULT" = "skipped"
          else
            test "$PR_RESULT" = "skipped"
            test "$MAIN_RESULT" = "success"
          fi

  release:
    # Update the release PR or create a release after main passes verification.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip.sha256" \
            --clobber
