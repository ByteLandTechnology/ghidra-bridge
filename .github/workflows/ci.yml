name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main. It can publish a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

jobs:
  release:
    # Update the release PR or create a draft release on main pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create draft release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release
    if: >-
      always() && !cancelled() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: ./gradlew --no-daemon clean verify

      - name: Run unit and headless tests
        run: |
          ./gradlew --no-daemon test
          python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

      - name: Build release archive
        if: needs.release.outputs.release_created == 'true'
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/package-release.sh --reuse-build "$RELEASE_VERSION"

      - name: Upload release artifacts
        if: needs.release.outputs.release_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-bridge-release
          path: |
            build/release/ghidra-bridge-${{ needs.release.outputs.version }}.zip
            build/release/ghidra-bridge-${{ needs.release.outputs.version }}.zip.sha256
          overwrite: true
          if-no-files-found: error

  publish:
    needs: [release, verify]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Verify release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          test -n "$RELEASE_SHA"
          test -n "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(jq -r '."."' .release-please-manifest.json)" = "$RELEASE_VERSION"
          test "$(tr -d '\r\n' < version.txt)" = "$RELEASE_VERSION"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ghidra-bridge-release
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          archive="dist/ghidra-bridge-${RELEASE_VERSION}.zip"
          checksum="dist/ghidra-bridge-${RELEASE_VERSION}.zip.sha256"
          test -s "$archive"
          test -s "$checksum"
          (cd dist && sha256sum -c "ghidra-bridge-${RELEASE_VERSION}.zip.sha256")
          gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber

      - name: Make release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=legacy --silent
