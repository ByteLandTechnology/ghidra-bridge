name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main. It can publish a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run repository verification
        run: ./gradlew --no-daemon verify

      - name: Test function mutations
        run: |
          python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
          python3 tests/list_scopes_and_relations_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

      - name: Test release archive reproducibility
        run: python3 tests/release_archive_reproducibility.py

  release:
    # Update the release PR or create a release after main passes verification.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Verify release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(jq -r '."."' .release-please-manifest.json)" = "$RELEASE_VERSION"
          test "$(cat version.txt)" = "$RELEASE_VERSION"

      - name: Install Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"

      - name: Test release build
        run: python3 tests/function_mutation_regression.py "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/ghidra-bridge-${{ needs.release.outputs.version }}.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          archive="build/release/ghidra-bridge-${RELEASE_VERSION}.zip"
          checksum="${archive}.sha256"
          test -s "$archive"
          test -s "$checksum"
          (cd build/release && sha256sum -c "ghidra-bridge-${RELEASE_VERSION}.zip.sha256")
          gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber

      - name: Make release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=legacy --silent
