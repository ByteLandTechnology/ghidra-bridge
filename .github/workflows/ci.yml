name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main. It can be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: ./gradlew --no-daemon clean verify

  release:
    # Publish a release after a push to main passes verification.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release reads the full history and all tags.
          fetch-depth: 0

      - name: Set up Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release tools
        # The repository has no lock file (see .npmrc).
        run: npm install

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
