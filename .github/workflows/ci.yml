name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Ghidra distribution
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ghidra-dist
          key: ghidra-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_BUILD_DATE }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          zip_name="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_BUILD_DATE}.zip"
          tag="Ghidra_${GHIDRA_VERSION}_build"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/${tag}/${zip_name}"
          curl -sL --fail -o "$zip_name" "$url"
          echo "${GHIDRA_ZIP_SHA256}  ${zip_name}" | sha256sum -c -
          mkdir -p ghidra-dist
          unzip -q "$zip_name" -d ghidra-dist
          rm "$zip_name"

      - name: Resolve GHIDRA_INSTALL_DIR
        run: |
          set -euo pipefail
          install_dir="$(find ghidra-dist -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          if [ -z "$install_dir" ]; then
            echo "Could not locate an extracted Ghidra directory under ghidra-dist/" >&2
            exit 1
          fi
          echo "GHIDRA_INSTALL_DIR=$(cd "$install_dir" && pwd)" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: ./gradlew --no-daemon clean verify
