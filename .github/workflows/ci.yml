name: CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main. It can be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use one Ghidra release and one Java version for each run.
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_BUILD_DATE: "20260605"
  GHIDRA_ZIP_SHA256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify repository hygiene
        run: bash .github/scripts/verify-repository-hygiene.sh

      - name: Run clean repository verification
        run: ./gradlew --no-daemon clean verify

  release:
    # Update the release PR or create a release after main passes verification.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Java and Ghidra
        uses: ./.github/actions/setup-ghidra
        with:
          ghidra-version: ${{ env.GHIDRA_VERSION }}
          ghidra-build-date: ${{ env.GHIDRA_BUILD_DATE }}
          ghidra-zip-sha256: ${{ env.GHIDRA_ZIP_SHA256 }}

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip" \
            "build/release/ghidra-bridge-${RELEASE_VERSION}.zip.sha256" \
            --clobber
