name: Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pull request title and commit
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            adapter
            build
            ci
            contracts
            docs
            domain
            launcher
            main
            mcp
            runtime
            transport
            transport:mcp
            transport:websocket
            websocket
            wire
          subjectPattern: ^[a-z].*(?<!\.)$
          subjectPatternError: >-
            The subject "{subject}" in "{title}" must start with a lowercase
            letter and must not end with a period.
          validateSingleCommit: true

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python3 -m pip install pre-commit==4.7.0

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Verify pull request commit messages
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --verify --quiet HEAD^2 || true)" == "$HEAD_SHA" ]]; then
            commits="$(git rev-list --reverse HEAD^1..HEAD^2)"
          elif git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
            commits="$(git rev-list --reverse "$HEAD_SHA" --not "$BASE_SHA" "refs/remotes/origin/${BASE_REF}")"
          else
            commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")"
          fi
          msg_file="$(mktemp)"
          trap 'rm -f "$msg_file"' EXIT
          while IFS= read -r sha; do
            [[ -n "$sha" ]] || continue
            printf 'Commit check: %s\n' "$sha"
            git log -1 --format=%B "$sha" >"$msg_file"
            pre-commit run --hook-stage commit-msg --commit-msg-filename "$msg_file"
          done <<< "$commits"
