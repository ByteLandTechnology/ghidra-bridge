name: Bug report
description: Report a problem with Ghidra Bridge.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues through the private process in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: List each action in order. Remove private token values.
      placeholder: |
        1. Build with `./gradlew buildGhidraScript`.
        2. Start `GhidraMcp.java` with `port=8766 session_id=demo`.
        3. Send a `tools/call` request to `ghidra.function`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add the error message or response.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Bridge.java outbound mode
        - Bridge.java embedded mode
        - GhidraMcp.java HTTP mode
        - Other or unknown
    validations:
      required: true
  - type: input
    id: ghidra-version
    attributes:
      label: Ghidra version
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant output. Remove private data.
      render: shell
