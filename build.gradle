import java.time.Duration
import java.util.concurrent.ConcurrentHashMap
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestOutputEvent
import org.gradle.api.tasks.testing.TestOutputListener
import org.gradle.api.tasks.testing.TestResult
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'base'
}

group = 'app.byteland'
// Release pull requests update version.txt. CI sets the same value with releaseVersion.
version = providers.gradleProperty('releaseVersion').getOrElse(file('version.txt').text.trim())

apply from: 'gradle/ghidra-detect.gradle'

subprojects {
    group = rootProject.group
    version = rootProject.version

    if (project.path == ':transport') {
        apply plugin: 'base'
        return
    }

    apply plugin: 'java-library'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    repositories { mavenCentral() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        timeout.set(Duration.ofMinutes(5))
        [
            'junit.jupiter.execution.timeout.default': '30s',
            'junit.jupiter.execution.timeout.testable.method.default': '30s',
            'junit.jupiter.execution.timeout.lifecycle.method.default': '30s',
            'junit.jupiter.execution.timeout.thread.mode.default': 'SAME_THREAD',
            'junit.jupiter.execution.timeout.mode': 'disabled_on_debug',
            'junit.jupiter.execution.timeout.threaddump.enabled': 'true',
        ].each { String key, String defaultValue ->
            systemProperty key, providers.systemProperty(key).getOrElse(defaultValue)
        }
        testLogging {
            events TestLogEvent.FAILED
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
            showStandardStreams = false
        }
        def bufferedStdout = new ConcurrentHashMap<Object, StringBuffer>()
        def bufferedStderr = new ConcurrentHashMap<Object, StringBuffer>()
        addTestOutputListener({ TestDescriptor descriptor, TestOutputEvent event ->
            def target = event.destination == TestOutputEvent.Destination.StdErr ? bufferedStderr : bufferedStdout
            target.computeIfAbsent(descriptor.id) { new StringBuffer() }.append(event.message)
        } as TestOutputListener)
        def printBufferedStreamsOnFailure = { TestDescriptor descriptor, TestResult result ->
            def stdoutText = bufferedStdout.remove(descriptor.id)
            def stderrText = bufferedStderr.remove(descriptor.id)
            if (result.resultType == TestResult.ResultType.FAILURE) {
                def label = descriptor.className ? "${descriptor.className}.${descriptor.name}" : descriptor.name
                if (stdoutText != null && stdoutText.length() > 0) {
                    logger.lifecycle("\nStandard output (${label}):\n${stdoutText.toString().stripTrailing()}")
                }
                if (stderrText != null && stderrText.length() > 0) {
                    logger.lifecycle("\nStandard error (${label}):\n${stderrText.toString().stripTrailing()}")
                }
            }
            if (descriptor.parent == null) {
                bufferedStdout.clear()
                bufferedStderr.clear()
            }
        }
        addTestListener(new TestListener() {
            @Override
            void beforeSuite(TestDescriptor suite) {}

            @Override
            void afterSuite(TestDescriptor suite, TestResult result) {
                printBufferedStreamsOnFailure(suite, result)
            }

            @Override
            void beforeTest(TestDescriptor testDescriptor) {}

            @Override
            void afterTest(TestDescriptor testDescriptor, TestResult result) {
                printBufferedStreamsOnFailure(testDescriptor, result)
            }
        })
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:serial,deprecation,removal,try', '-Werror'])
    }
    def subprojectCheck = tasks.named('check')
    rootProject.tasks.named('check') {
        dependsOn subprojectCheck
    }
}

def ghidraJars = ghidraInstallDir == null ? files() : fileTree(dir: ghidraInstallDir, include: ['**/*.jar'])

project(':wire') {
    dependencies { api project(':domain') }
}
project(':contracts') {
    dependencies {
        implementation project(':wire')
        implementation 'org.snakeyaml:snakeyaml-engine:2.10'
    }
}
project(':runtime') {
    dependencies { api project(':wire') }
}
project(':adapter') {
    dependencies {
        api project(':domain')
        implementation project(':wire')
        implementation project(':runtime')
        compileOnly ghidraJars
        testImplementation ghidraJars
    }
}
project(':transport:websocket') {
    dependencies { api project(':runtime') }
}
project(':transport:mcp') {
    dependencies { api project(':runtime') }
}
project(':launcher') {
    dependencies {
        implementation project(':adapter')
        implementation project(':transport:websocket')
        implementation project(':transport:mcp')
        compileOnly ghidraJars
        testImplementation ghidraJars
    }
}

tasks.register('verifyGhidraInstallDir') {
    doLast {
        if (ghidraInstallDir == null) {
            throw new GradleException('Ghidra installation not found. Set GHIDRA_INSTALL_DIR or -PghidraInstallDir.')
        }
    }
}
project(':adapter').tasks.named('compileJava') { dependsOn rootProject.tasks.named('verifyGhidraInstallDir') }
project(':launcher').tasks.named('compileJava') { dependsOn rootProject.tasks.named('verifyGhidraInstallDir') }
project(':launcher').tasks.named('compileTestJava') { dependsOn rootProject.tasks.named('verifyGhidraInstallDir') }

project(':launcher') {
    tasks.register('runtimeJar', Jar) {
        dependsOn tasks.named('classes'), configurations.runtimeClasspath
        archiveFileName = 'ghidra-bridge.jar'
        destinationDirectory = layout.buildDirectory.dir('runtime-libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from(sourceSets.main.output)
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
        manifest { attributes 'Main-Class': 'app.byteland.ghidra.Bootstrap',
            'Implementation-Version': rootProject.version }
    }

    def generateScript = { String taskName, String className, String bootstrapMethod, String logPrefix, String description ->
        tasks.register(taskName, Copy) {
            from 'src/main/templates/GhidraLauncher.java.template'
            into layout.buildDirectory.dir('generated/scripts')
            rename { className + '.java' }
            filter { String line ->
                line.replace('__CLASS__', className)
                    .replace('__BOOTSTRAP_METHOD__', bootstrapMethod)
                    .replace('__LOG_PREFIX__', logPrefix)
                    .replace('__DESCRIPTION__', description)
            }
        }
    }
    generateScript(
        'generateBridgeScript',
        'Bridge',
        'startFromScript',
        'ghidra-bridge',
        'Starts the Ghidra Bridge WebSocket service for the active program.')
    generateScript(
        'generateMcpScript',
        'GhidraMcp',
        'startMcpFromScript',
        'ghidra-mcp',
        'Starts the Ghidra Bridge MCP HTTP service for the active program.')

    tasks.register('buildGhidraScript', Sync) {
        dependsOn tasks.named('runtimeJar'), tasks.named('generateBridgeScript'), tasks.named('generateMcpScript')
        into rootProject.layout.buildDirectory.dir('ghidra-script')
        from layout.buildDirectory.dir('generated/scripts')
        from tasks.named('runtimeJar')
    }
}

tasks.register('buildGhidraScript') {
    dependsOn ':launcher:buildGhidraScript'
}

def contractOutputs = ['docs/asyncapi.yaml', 'docs/mcp-tools.json', 'docs/api.md']
def contractGenerators = [
    [name: 'Api', projectPath: ':contracts',
        mainClass: 'app.byteland.ghidra.api.ApiContractGenerator'],
    [name: 'Mcp', projectPath: ':transport:mcp', mainClass: 'app.byteland.ghidra.mcp.McpContractGenerator']
]
contractGenerators.each { generator ->
    tasks.register("generate${generator.name}Contract", JavaExec) {
        group = 'documentation'
        dependsOn project(generator.projectPath).tasks.named('classes')
        classpath = project(generator.projectPath).sourceSets.main.runtimeClasspath
        mainClass = generator.mainClass
        args rootDir.absolutePath
    }
    tasks.register("stage${generator.name}Contract", JavaExec) {
        group = 'verification'
        dependsOn project(generator.projectPath).tasks.named('classes')
        classpath = project(generator.projectPath).sourceSets.main.runtimeClasspath
        mainClass = generator.mainClass
        args layout.buildDirectory.dir('generated-contracts').get().asFile.absolutePath
    }
}
tasks.register('generateApiContracts') {
    group = 'documentation'
    dependsOn 'generateApiContract', 'generateMcpContract'
}
tasks.register('verifyApiContracts') {
    group = 'verification'
    dependsOn 'stageApiContract', 'stageMcpContract'
    doLast {
        contractOutputs.each { relative ->
            def checkedIn = file(relative)
            def generated = layout.buildDirectory.file("generated-contracts/${relative}").get().asFile
            if (!checkedIn.isFile() || !generated.isFile() || checkedIn.text != generated.text) {
                throw new GradleException("Generated contract drift: ${relative}; run ./gradlew generateApiContracts")
            }
        }
    }
}

tasks.register('verifyDistribution') {
    group = 'verification'
    dependsOn 'buildGhidraScript', 'compileGeneratedScripts', ':launcher:test'
    doLast {
        def output = layout.buildDirectory.dir('ghidra-script').get().asFile
        def names = output.listFiles().collect { it.name }.sort()
        if (names != ['Bridge.java', 'GhidraMcp.java', 'ghidra-bridge.jar']) {
            throw new GradleException("Unexpected distribution contents: ${names}")
        }
        [
            'Bridge.java': 'Starts the Ghidra Bridge WebSocket service for the active program.',
            'GhidraMcp.java': 'Starts the Ghidra Bridge MCP HTTP service for the active program.'
        ].each { scriptName, expectedDescription ->
            def scriptFile = new File(output, scriptName)
            def lines = scriptFile.readLines('UTF-8')
            if (lines.any { it.contains('__') && it ==~ /.*__[A-Z_]+__.*/ }) {
                throw new GradleException("Unreplaced template placeholder in ${scriptName}")
            }
            if (lines.size() < 2 || lines[0] != "// ${expectedDescription}") {
                throw new GradleException("Missing or unexpected Script Manager description header in ${scriptName}")
            }
            if (lines[1] != '// @category Ghidra Bridge') {
                throw new GradleException("Missing or unexpected @category header in ${scriptName}")
            }
        }
        new java.util.jar.JarFile(new File(output, 'ghidra-bridge.jar')).withCloseable { jar ->
            if (jar.getJarEntry('app/byteland/ghidra/Bootstrap.class') == null) {
                throw new GradleException('Runtime jar is missing Bootstrap.class')
            }
            if (jar.entries().find { it.name.startsWith('org/snakeyaml/') } != null) {
                throw new GradleException('Runtime jar contains the contract YAML library')
            }
        }
    }
}

tasks.register('compileGeneratedScripts', JavaCompile) {
    group = 'verification'
    dependsOn ':launcher:generateBridgeScript', ':launcher:generateMcpScript', 'verifyGhidraInstallDir'
    source project(':launcher').layout.buildDirectory.dir('generated/scripts')
    classpath = ghidraJars
    destinationDirectory = layout.buildDirectory.dir('compiled-scripts')
    sourceCompatibility = '21'
    targetCompatibility = '21'
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:serial,deprecation,removal,try', '-Werror'])
}

project(':launcher').tasks.named('test', Test) {
    classpath += files(tasks.named('compileGeneratedScripts'))
}

def stripJavaComments = { String source ->
    def result = new StringBuilder(source.length())
    int index = 0
    int length = source.length()
    while (index < length) {
        char current = source.charAt(index)
        char next = index + 1 < length ? source.charAt(index + 1) : (char) 0
        if (current == (char) '/' && next == (char) '/') {
            index += 2
            while (index < length && source.charAt(index) != (char) '\n') {
                index++
            }
            continue
        }
        if (current == (char) '/' && next == (char) '*') {
            boolean multiline = false
            index += 2
            while (index + 1 < length
                && !(source.charAt(index) == (char) '*' && source.charAt(index + 1) == (char) '/')) {
                if (source.charAt(index) == (char) '\n') {
                    multiline = true
                }
                index++
            }
            index = Math.min(length, index + 2)
            result.append(multiline ? '\n' : ' ')
            continue
        }
        if (current == (char) '"' && index + 2 < length
            && source.charAt(index + 1) == (char) '"' && source.charAt(index + 2) == (char) '"') {
            index += 3
            while (index + 2 < length
                && !(source.charAt(index) == (char) '"'
                    && source.charAt(index + 1) == (char) '"'
                    && source.charAt(index + 2) == (char) '"')) {
                index += source.charAt(index) == (char) '\\' ? 2 : 1
            }
            index = Math.min(length, index + 3)
            result.append('""')
            continue
        }
        if (current == (char) '"' || current == (char) '\'') {
            char quote = current
            index++
            while (index < length && source.charAt(index) != quote && source.charAt(index) != (char) '\n') {
                index += source.charAt(index) == (char) '\\' ? 2 : 1
            }
            if (index < length && source.charAt(index) == quote) {
                index++
            }
            result.append(quote).append(quote)
            continue
        }
        result.append(current)
        index++
    }
    return result.toString()
}

tasks.register('verifyArchitecture') {
    group = 'verification'
    doLast {
        def forbiddenImport = ~/(?m)^\s*import\s+(?:static\s+)?ghidra\..*/
        ['domain', 'wire', 'contracts', 'runtime', 'transport/websocket', 'transport/mcp']
            .each { module ->
            fileTree("modules/${module}/src") { include '**/*.java' }.each { source ->
                def stripped = stripJavaComments(source.getText('UTF-8'))
                if (forbiddenImport.matcher(stripped).find()) {
                    throw new GradleException("Ghidra API import outside adapter/launcher: ${source}")
                }
            }
        }
    }
}

tasks.register('verifyMcpDocumentation', JavaExec) {
    group = 'verification'
    dependsOn project(':transport:mcp').tasks.named('classes'), 'verifyApiContracts'
    classpath = project(':transport:mcp').sourceSets.main.runtimeClasspath
    mainClass = 'app.byteland.ghidra.mcp.McpContractGenerator'
    args '--verify', rootDir.absolutePath
}

tasks.register('verify') {
    group = 'verification'
    dependsOn 'check', 'verifyApiContracts', 'verifyMcpDocumentation', 'verifyDistribution', 'verifyArchitecture'
}
